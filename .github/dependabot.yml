# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "bundler" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    # Pinned + vendored single-owner gems (RubyGems profile 2325, former staff member).
    # Do not let Dependabot bump these back to an upstream-resolved version — the
    # upstream owner can still publish/rewrite these gems on rubygems.org.
    ignore:
      - dependency-name: "abstract_command"
      - dependency-name: "isna"
